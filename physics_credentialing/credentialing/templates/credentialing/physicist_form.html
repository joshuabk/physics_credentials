{% extends "credentialing/base.html" %}
{% block title %}Add Physicist{% endblock %}
{% block content %}
<div class="page-header"><h1>Add Physicist</h1></div>
<div class="card" style="max-width:520px;padding:24px;">
  <form method="post">{% csrf_token %}
    <label class="text-muted text-sm">First name</label>
    <input name="first_name" class="form-control" style="margin:5px 0 14px;" required>
    <label class="text-muted text-sm">Last name</label>
    <input name="last_name" class="form-control" style="margin:5px 0 14px;" required>
    <label class="text-muted text-sm">Email</label>
    <input name="email" type="email" class="form-control" style="margin:5px 0 14px;" required>
    <label class="text-muted text-sm">Title</label>
    <input name="title" class="form-control" placeholder="Medical Physicist" style="margin:5px 0 20px;">
    <div class="flex gap-2">
      <button type="submit" class="btn btn-primary">Add Physicist</button>
      <a href="/physicists/" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
